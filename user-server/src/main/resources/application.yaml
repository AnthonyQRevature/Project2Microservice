spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://database:5432/postgres
    username: postgres
    password: secret
    driver-class-name: org.postgresql.Driver

server:
  port: 8080

eureka:
  #  instance:
  #    hostname: localhost
  client:
    enabled: true
    service-url:
      defaultZone: http://eureka:8761/eureka
    register-with-eureka: true
    fetch-registry: true
    instance:
      prefer-ip-address: true
